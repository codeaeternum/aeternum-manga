name: Rebuild extensions repo

on:
  workflow_dispatch:
  schedule:
    # Semanal: lunes 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (aeternum-manga)
        uses: actions/checkout@v4
        with:
          path: aeternum-manga

      - name: Clone upstream extensions-source (pinned)
        run: |
          git clone --depth 1 https://github.com/keiyoushi/extensions-source extensions-source
          cd extensions-source
          git fetch --depth 1 origin de743aed846da53e00c45ab26ee0e77f7bb4355b
          git checkout FETCH_HEAD

      - name: Auto-bump changed modules
        working-directory: aeternum-manga
        run: python3 version-bump.py

      - name: Install aeternum modules
        run: |
          cd extensions-source
          for d in ../aeternum-manga/patches/modules/*/*/; do
            rm -rf "src/${d#../aeternum-manga/patches/modules/}"
          done
          cp -R ../aeternum-manga/patches/modules/* src/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Android SDK platform 37
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Restore signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > extensions-source/signingkey.jks

      - name: Harden gradle wrapper download
        working-directory: extensions-source
        # El wrapper descarga la distro en runner frío; upstream fija
        # networkTimeout=10s y retries=0 — una caída lenta de
        # services.gradle.org mata el build. El wrapper solo lee estos
        # valores de este archivo (no de -D ni env).
        run: |
          sed -i \
            -e 's/^networkTimeout=.*/networkTimeout=120000/' \
            -e 's/^retries=.*/retries=3/' \
            -e 's/^retryBackOffMs=.*/retryBackOffMs=2000/' \
            gradle/wrapper/gradle-wrapper.properties
          # Pre-sembrar la distro en el path del wrapper
          # (wrapper/dists/<nombre>/<md5(url)>/): si services.gradle.org
          # va mal, el zip idéntico vive en github releases (su redirect).
          URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | sed 's/\\//g')
          NAME=$(basename "$URL")
          HASH=$(echo -n "$URL" | md5sum | cut -d' ' -f1)
          DIST="$HOME/.gradle/wrapper/dists/${NAME%.zip}/$HASH"
          mkdir -p "$DIST"
          VER=$(echo "$NAME" | sed -E 's/gradle-(.+)-(bin|all)\.zip/\1/')
          curl -fL --retry 4 --retry-delay 5 -o "$DIST/$NAME" "$URL" \
            || curl -fL --retry 4 --retry-delay 5 -o "$DIST/$NAME" \
                 "https://github.com/gradle/gradle-distributions/releases/download/v$VER/$NAME"

      - name: Build extensions (apk + jar)
        working-directory: extensions-source
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :src:all:mangaplus:assembleRelease \
            :src:all:novelcool:assembleRelease \
            :src:all:webtoons:assembleRelease \
            :src:es:hentaimode:assembleRelease \
            :src:es:ikigaimangas:assembleRelease \
            :src:es:lectortmoo:assembleRelease \
            :src:es:leercapitulo:assembleRelease \
            :src:es:manhwaweb:assembleRelease \
            :src:es:rncalation:assembleRelease

      - name: Verify jars (signature + refs)
        working-directory: aeternum-manga
        run: python3 verify-jars.py

      - name: Regenerate repo index
        working-directory: aeternum-manga
        run: python3 build-repo.py

      - name: Commit and push if changed
        working-directory: aeternum-manga
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Rebuild: upstream sync ($(date -u +%Y-%m-%d))"
            git push
          fi
